name: 開催中の見張り（自動予想）

# 1回起動すると約5時間40分、90秒おきに開催場を確認して買い目・記事を記録する。
# 終わるときに自分をもう一度起動して、ずっと見張りを続ける（GitHubの定期実行が動かないため）。
# 日本時間 1:00〜8:00 は予想せず、前日分の結果取得と集計だけ行って待機する。
on:
  schedule:
    - cron: "41 23 * * *"   # 日本時間 8:41（見張りが止まっていたときの保険）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 見張り
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          save() {
            for d in data articles report.txt; do [ -e $d ] && git add -A $d; done
            if ! git diff --cached --quiet; then
              git commit -q -m "$1 $(TZ=Asia/Tokyo date '+%F %H:%M')"
              git pull --rebase -q && git push -q || echo "保存に失敗（次回やり直し）"
            fi
          }
          end=$((SECONDS + 20400))
          while [ $SECONDS -lt $end ]; do
            git pull --rebase -q || true
            h=$(TZ=Asia/Tokyo date +%-H)
            if [ $h -ge 1 ] && [ $h -lt 8 ]; then
              # 深夜：結果の取得と集計（1日1回で足りるので、1時台と5時台だけ）
              if [ $h -eq 1 ] || [ $h -eq 5 ]; then
                python cli.py fill > report.txt || true
                save "結果取得と検証集計"
              fi
              sleep 1800
              continue
            fi
            python autopick.py || echo "今回の確認でエラー（次回やり直し）"
            save "自動予想"
            sleep 90
          done
      - name: 見張りを引き継ぐ
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main -R "$GITHUB_REPOSITORY" && echo "次の見張りを起動"
