name: 自動予想（1回だけ確認）

# 普段は watch.yml が見張る。これは手動で1回だけ確認したいとき用
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  pick:
    # 非公開リポジトリでは自動実行しない（無料枠を使い切らないため）。手動実行は可
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 試走が出たレースの買い目を記録
        run: python autopick.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 台帳を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for d in data articles; do [ -d $d ] && git add -A $d; done; true
          git diff --cached --quiet && exit 0
          git commit -m "自動予想 $(TZ=Asia/Tokyo date '+%F %H:%M')"
          git pull --rebase -q && git push
